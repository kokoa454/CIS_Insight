{% extends "base.html" %}
{% load static %}

{% block title %}CIS Insight{% endblock %}

{% block main %}
<header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200/60">
    <div class="container-main px-4 h-16 sm:h-20 flex justify-between items-center">
        <div class="flex items-center gap-3 group cursor-pointer">
            <div class="p-1 bg-slate-50 rounded-lg group-hover:scale-105 transition-transform">
                <img src="{% static 'img/logo.png' %}" class="w-8 h-8 sm:w-12 sm:h-12 object-contain" alt="Logo">
            </div>
            <span class="text-subtitle tracking-tighter text-slate-900 font-cis_insight">
                CIS <span class="text-red-600">Insight</span>
            </span>
        </div>
    </div>
</header>
<main>
    <div class="container-main px-4 py-16 sm:py-32 text-center">
        <div class="max-w-2xl mx-auto">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-red-50 rounded-full mb-8 border border-red-100">
                <svg class="w-14 h-14 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            <h1 class="text-display text-slate-900 font-ja mb-4">{{ error_code|default:"400" }}</h1>
            <p class="text-large text-slate-500 font-ja mb-8">{{ error_message|default:"アクセスしようとしたページは、見つからないか、移動または削除されました。" }}</p>
            
            <div class="space-y-4">
                <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center gap-2 px-6 py-4 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-lg hover:shadow-xl shadow-blue-200 font-ja w-full sm:w-auto">
                    ダッシュボードに戻る
                </a>
                
                <button onclick="history.back()" class="inline-flex items-center gap-2 px-6 py-4 text-slate-600 hover:text-slate-900 hover:bg-slate-50 rounded-lg font-semibold transition-colors font-ja w-full sm:w-auto">
                    前のページに戻る
                </button>
            </div>
        </div>
    </div>
</main>
{% endblock %}
